input_polygons:
  - datasets: 
      - ./bgt/bgt_wegdeel.sqlite
      - ./bgt/bgt_ondersteunendwegdeel.sqlite
    uniqueid: gml_id
    lifting: Road
    height_field: relatievehoogteligging

  - datasets: 
      - ./bgt/bgt_pand.sqlite
    uniqueid: gml_id
    lifting: Building
    height_field: relatievehoogteligging


lifting_options: 
  Building:
    lod: 1
    floor: true
    inner_walls: true
    triangulate: false
    ground:
      height: percentile-10
      use_LAS_classes:
        - 2   # sesuai permintaan (building pakai class 2)
    roof:
      height: percentile-90
      use_LAS_classes:
        - 2   # konsisten building dari class 2

  Road:
    height: percentile-50
    use_LAS_classes:
     - 6   # sesuai permintaan (road pakai class 6)


input_elevation:
  - datasets:
      - ./ahn3/ahn3_cropped_1.laz
      - ./ahn3/ahn3_cropped_2.laz
    omit_LAS_classes:
      - 0
      - 1
    thinning: 0


options:
  building_radius_vertex_elevation: 3.0
  radius_vertex_elevation: 1.0
  threshold_jump_edges: 0.5
